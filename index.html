<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelinci Coding: Ayo Melompat!</title>
    <style>
        :root {
            --bg-top: #4fc3f7;
            --bg-bottom: #81c784;
            --grid-bg: #aed581;
            --grid-border: #7cb342;
            --block-up: #ef5350;    /* Merah */
            --block-down: #42a5f5;  /* Biru */
            --block-left: #ffca28;  /* Kuning */
            --block-right: #66bb6a; /* Hijau */
            --ui-bg: #ffffff;
            --text-main: #37474f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            height: 100vh; 
            overflow-y: auto; /* Dibaiki: Membenarkan skrol jika skrin terlalu kecil */
            overflow-x: hidden;
            background: linear-gradient(to bottom, var(--bg-top), #e1f5fe 40%, var(--bg-bottom) 40%, #4caf50 100%);
            display: flex; 
            flex-direction: column;
            touch-action: manipulation; /* Mencegah zoom saat di-tap ganda di HP */
        }

        /* --- UI POPUPS (Menu, Win, Overlay) --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .card {
            background: white; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); border: 5px solid #fff;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { color: #ff9800; font-size: 2.2rem; margin: 0 0 10px 0; text-shadow: 2px 2px 0px #ffe0b2; }
        p { color: #555; font-size: 1.2rem; line-height: 1.5; margin-bottom: 20px; }
        .highlight { color: #e91e63; font-weight: bold; font-size: 1.4rem; display: block; margin-top: 10px; animation: pulse 1.5s infinite; }

        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px; 
            color: white; font-weight: bold; cursor: pointer; font-size: 1.5rem; 
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0px #000 !important; }
        .btn-start { background: linear-gradient(to right, #ff9800, #f57c00); box-shadow: 0 6px #e65100; }
        
        /* Dibaiki: Mengurangkan saiz padding dan membuang margin-top yang menolak elemen ke bawah */
        .btn-play { background: linear-gradient(to right, #66bb6a, #43a047); box-shadow: 0 4px #2e7d32; flex: 2; font-size: 0.85rem; padding: 0 5px; display: flex; justify-content: center; align-items: center; text-align: center; margin: 0; border-radius: 10px;}
        .btn-clear { background: #e0e0e0; color: #333; box-shadow: 0 4px #bdbdbd; flex: 1; font-size: 1.2rem; padding: 0 5px; display: flex; justify-content: center; align-items: center; text-align: center; margin: 0; border-radius: 10px;}

        /* --- GAME ARENA --- */
        #game-arena { 
            display: none; 
            flex: 1; 
            flex-direction: column; 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto; 
            overflow-y: auto; /* Dibaiki: Skrol khas untuk arena permainan */
        }
        
        /* HEADER */
        .header { text-align: center; padding: 10px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); font-size: 1.5rem; font-weight: bold; flex-shrink: 0; }

        /* GRID BOARD */
        .board-container { flex: 1 0 auto; display: flex; justify-content: center; align-items: center; padding: 20px 10px 40px 10px; perspective: 800px; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            /* Dibaiki: Mengecilkan sedikit saiz papan untuk memberi ruang kepada butang di bawah */
            width: 80vw; max-width: 350px;
            height: 80vw; max-height: 350px;
            background: #8bc34a;
            padding: 10px; border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.3);
            position: relative;
            transform: rotateX(10deg);
            margin-bottom: 20px;
        }
        .cell {
            background: var(--grid-bg); border: 2px solid var(--grid-border);
            border-radius: 8px; position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        /* SPRITES (Kelinci, Wortel, Batu) */
        .sprite { 
            position: absolute; 
            transition: all 0.5s ease; 
            z-index: 10; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Animasi Melompat (Motorik Kasar) */
        @keyframes hopUp {
            0% { transform: translateY(0) scale(1, 1); }
            30% { transform: translateY(-40px) scale(0.9, 1.1); }
            50% { transform: translateY(-50px) scale(1, 1); }
            70% { transform: translateY(-40px) scale(1.1, 0.9); }
            100% { transform: translateY(0) scale(1, 1); }
        }
        .hopping { animation: hopUp 0.6s ease-in-out !important; }
        .idle-bounce { animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* --- KONTROL CODING (BAWAH) --- */
        .coding-area {
            background: white; border-top: 5px solid #ffca28;
            border-radius: 20px 20px 0 0; 
            padding: 15px 15px 30px 15px; /* Dibaiki: Penyelarasan ruang dalam (padding) */
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.15);
            flex-shrink: 0; /* Dibaiki: Mengelakkan kotak kod dari mengecut dan hilang */
            position: relative;
            z-index: 20;
        }

        /* Tempat naruh blok (Sequence) */
        .sequence-box {
            background: #f5f5f5; border: 3px dashed #ccc; border-radius: 12px;
            height: 60px; /* Dibaiki: Kurangkan sedikit ketinggian kotak urutan */
            display: flex; align-items: center; padding: 5px;
            overflow-x: auto; gap: 5px;
        }
        .sequence-box:empty::before {
            content: "Ketuk panah menyusun kode...";
            color: #aaa; font-style: italic; margin: auto; font-size: 1rem;
        }

        /* Palette Panah & Controls (Sejajar) */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 8px;
            width: 100%;
        }

        .palette { display: flex; gap: 5px; }
        .coding-block {
            width: 42px; height: 42px; border-radius: 10px; border: none; 
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 4px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .coding-block:active { transform: translateY(4px); box-shadow: 0 0 rgba(0,0,0,0); }
        
        .coding-block svg { width: 24px; height: 24px; fill: white; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        
        .cb-up { background: var(--block-up); }
        .cb-down { background: var(--block-down); }
        .cb-left { background: var(--block-left); }
        .cb-right { background: var(--block-right); }

        .block-item {
            min-width: 40px; height: 40px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            animation: popIn 0.2s; cursor: pointer;
            box-shadow: 0 3px rgba(0,0,0,0.2);
        }
        .block-item svg { width: 22px; height: 22px; fill: white; }

        .controls { display: flex; flex: 1; gap: 5px; }

        /* Feedback Error */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(2px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 
            40%, 60% { transform: translate3d(4px, 0, 0); } 
        }
    </style>
</head>
<body>

    <!-- MENU UTAMA -->
    <div id="menu-screen" class="overlay">
        <div class="card">
            <h1>🐰 Kelinci Coding 🥕</h1>
            <p>Bantu kelinci putih mencari wortel dengan menyusun panah arah.</p>
            <p style="font-size: 1rem; color: #1976D2; background: #e3f2fd; padding: 10px; border-radius: 8px;">
                <b>Tips untuk Ayah/Bunda & Guru:</b><br>
                Saat kelinci di layar melompat, ajak anak untuk ikut <b>MELOMPAT</b> di dunia nyata!
            </p>
            <span class="highlight">Ayo Melompat Bersama!</span>
            <button class="btn btn-start" onclick="startGame()" style="margin-top: 20px;">▶ MULAI BERMAIN</button>
        </div>
    </div>

    <!-- MENANG / LEVEL SELESAI -->
    <div id="win-screen" class="overlay" style="display:none">
        <div class="card">
            <h1>🎉 HOREEE! 🎉</h1>
            <p>Kelinci berhasil mendapatkan wortelnya!</p>
            <!-- SVG Kelinci Senang -->
            <svg width="100" height="100" viewBox="0 0 100 100" class="idle-bounce">
                <circle cx="50" cy="50" r="40" fill="white" />
                <path d="M 30 50 Q 50 70 70 50" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
                <ellipse cx="35" cy="40" rx="4" ry="8" fill="#333"/>
                <ellipse cx="65" cy="40" rx="4" ry="8" fill="#333"/>
                <path d="M 45 45 L 50 50 L 55 45" stroke="pink" stroke-width="3" fill="none"/>
                <!-- Telinga -->
                <ellipse cx="35" cy="15" rx="8" ry="25" fill="white" transform="rotate(-15 35 15)"/>
                <ellipse cx="35" cy="15" rx="4" ry="15" fill="pink" transform="rotate(-15 35 15)"/>
                <ellipse cx="65" cy="15" rx="8" ry="25" fill="white" transform="rotate(15 65 15)"/>
                <ellipse cx="65" cy="15" rx="4" ry="15" fill="pink" transform="rotate(15 65 15)"/>
            </svg>
            <button class="btn btn-start" onclick="nextLevel()" style="margin-top: 20px;">LEVEL SELANJUTNYA ➔</button>
        </div>
    </div>

    <!-- GAME ARENA -->
    <div id="game-arena">
        <div class="header" id="level-text">Level 1</div>
        
        <div class="board-container">
            <div class="board" id="board">
                <!-- Grid Cells akan di-generate oleh JS -->
            </div>
        </div>

        <div class="coding-area">
            <div class="sequence-box" id="sequence-box">
                <!-- Block sequence akan muncul di sini -->
            </div>
            
            <div class="action-row">
                <div class="palette">
                    <button class="coding-block cb-up" onclick="addBlock('up')">
                        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                    </button>
                    <button class="coding-block cb-down" onclick="addBlock('down')">
                        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></svg>
                    </button>
                    <button class="coding-block cb-left" onclick="addBlock('left')">
                        <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
                    </button>
                    <button class="coding-block cb-right" onclick="addBlock('right')">
                        <svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-6h-8v-4h8v-6z"/></svg>
                    </button>
                </div>

                <div class="controls">
                    <button class="btn btn-clear" onclick="clearSequence()" title="Hapus">🗑</button>
                    <button class="btn btn-play" id="btn-play" onclick="runCode()">▶ JALAN</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ASSETS (SVG Inline) ---
        const SVG_BUNNY = `
            <svg viewBox="0 0 100 100" style="width:100%; height:100%; drop-shadow: 2px 4px 4px rgba(0,0,0,0.4);">
                <ellipse cx="50" cy="65" rx="30" ry="25" fill="white"/>
                <circle cx="50" cy="40" r="22" fill="white"/>
                <!-- Telinga -->
                <ellipse cx="40" cy="15" rx="6" ry="20" fill="white" transform="rotate(-15 40 15)"/>
                <ellipse cx="40" cy="15" rx="3" ry="12" fill="pink" transform="rotate(-15 40 15)"/>
                <ellipse cx="60" cy="15" rx="6" ry="20" fill="white" transform="rotate(15 60 15)"/>
                <ellipse cx="60" cy="15" rx="3" ry="12" fill="pink" transform="rotate(15 60 15)"/>
                <!-- Mata -->
                <circle cx="43" cy="35" r="3" fill="#333"/>
                <circle cx="57" cy="35" r="3" fill="#333"/>
                <!-- Hidung -->
                <path d="M 48 42 L 52 42 L 50 45 Z" fill="pink"/>
                <!-- Kaki -->
                <ellipse cx="35" cy="85" rx="10" ry="5" fill="white"/>
                <ellipse cx="65" cy="85" rx="10" ry="5" fill="white"/>
                <!-- Ekor -->
                <circle cx="20" cy="65" r="8" fill="#f0f0f0"/>
            </svg>
        `;

        const SVG_CARROT = `
            <svg viewBox="0 0 100 100" class="idle-bounce" style="width:100%; height:100%; filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.3));">
                <path d="M 40 20 Q 50 0 60 20 L 50 90 Z" fill="#ff9800"/>
                <path d="M 45 40 Q 50 50 55 40" stroke="#e65100" stroke-width="2" fill="none"/>
                <path d="M 42 60 Q 50 70 52 60" stroke="#e65100" stroke-width="2" fill="none"/>
                <!-- Daun -->
                <path d="M 50 20 Q 30 0 45 10 Z" fill="#4caf50"/>
                <path d="M 50 20 Q 70 0 55 10 Z" fill="#4caf50"/>
                <path d="M 50 20 Q 50 -5 50 10 Z" stroke="#4caf50" stroke-width="4"/>
            </svg>
        `;

        const SVG_ROCK = `
            <svg viewBox="0 0 100 100" style="width:100%; height:100%; filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.4));">
                <path d="M 20 80 Q 10 50 30 30 Q 50 10 70 30 Q 90 50 80 80 Q 50 95 20 80 Z" fill="#78909c"/>
                <path d="M 30 40 Q 40 30 50 40" stroke="#b0bec5" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 60 60 Q 70 50 75 65" stroke="#546e7a" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
        `;

        const SVG_ARROWS = {
            up: `<svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>`,
            down: `<svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></svg>`,
            left: `<svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>`,
            right: `<svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-6h-8v-4h8v-6z"/></svg>`
        };

        // --- GAME LOGIC ---
        const LEVELS = [
            { start: {x:0, y:3}, goal: {x:1, y:3}, rocks: [] }, // Lv 1: Maju 1 langkah (Kanan 1x)
            { start: {x:0, y:3}, goal: {x:3, y:3}, rocks: [] }, // Lv 2: Maju lurus panjang (Kanan 3x)
            { start: {x:0, y:3}, goal: {x:0, y:1}, rocks: [] }, // Lv 3: Belajar arah atas (Atas 2x)
            { start: {x:0, y:3}, goal: {x:2, y:1}, rocks: [] }, // Lv 4: Bentuk L (Kanan 2x, Atas 2x)
            { start: {x:0, y:0}, goal: {x:2, y:2}, rocks: [] }, // Lv 5: Bentuk L turun (Kanan 2x, Bawah 2x)
            { start: {x:0, y:3}, goal: {x:2, y:3}, rocks: [{x:1, y:3}] }, // Lv 6: Ada 1 halangan batu (Atas, Kanan, Kanan, Bawah)
            { start: {x:0, y:3}, goal: {x:3, y:0}, rocks: [{x:1, y:3}, {x:2, y:1}, {x:2, y:2}] }, // Lv 7: Lorong berbelok
            { start: {x:0, y:0}, goal: {x:3, y:3}, rocks: [{x:0, y:1}, {x:1, y:1}, {x:2, y:3}, {x:3, y:1}] } // Lv 8: Peringkat akhir yang lebih mencabar
        ];

        let currentLevel = 0;
        let sequence = [];
        let isRunning = false;
        
        // Status Posisi
        let bunnyPos = {x:0, y:0};
        let bunnyDOM = null;

        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function initAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playHopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // Nada: C5, E5, G5, C6
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.value = freq;
                
                const startTime = audioCtx.currentTime + (i * 0.15);
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        function playCrashSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function startGame() {
            initAudio(); // Aktifkan audio apabila butang mula ditekan
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-arena').style.display = 'flex';
            loadLevel(0);
        }

        function nextLevel() {
            document.getElementById('win-screen').style.display = 'none';
            currentLevel++;
            if (currentLevel >= LEVELS.length) {
                // Tamat
                alert("Wah, kamu hebat sekali! Semua level selesai!");
                currentLevel = 0;
                document.getElementById('menu-screen').style.display = 'flex';
                document.getElementById('game-arena').style.display = 'none';
            } else {
                loadLevel(currentLevel);
            }
        }

        function loadLevel(lvlIndex) {
            const level = LEVELS[lvlIndex];
            document.getElementById('level-text').innerText = `Level ${lvlIndex + 1}`;
            bunnyPos = { ...level.start };
            sequence = [];
            renderSequence();
            buildBoard(level);
            enableControls(true);
        }

        function buildBoard(level) {
            const board = document.getElementById('board');
            board.innerHTML = ''; // Bersihkan board

            // Buat 16 cell (4x4)
            for (let y = 0; y < 4; y++) {
                for (let x = 0; x < 4; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    
                    // Render Goal
                    if (x === level.goal.x && y === level.goal.y) {
                        cell.innerHTML = SVG_CARROT;
                    }
                    
                    // Render Rocks
                    if (level.rocks.some(r => r.x === x && r.y === y)) {
                        cell.innerHTML = SVG_ROCK;
                        cell.dataset.rock = "true";
                    }

                    board.appendChild(cell);
                }
            }

            // Letakkan Kelinci
            bunnyDOM = document.createElement('div');
            bunnyDOM.className = 'sprite';
            bunnyDOM.innerHTML = SVG_BUNNY;
            updateBunnyPosition();
        }

        function updateBunnyPosition() {
            const targetCell = document.getElementById(`cell-${bunnyPos.x}-${bunnyPos.y}`);
            if (targetCell) {
                // Tambahkan kelinci ke board secara absolute overlay
                if (!bunnyDOM.parentElement) {
                    document.getElementById('board').appendChild(bunnyDOM);
                }
                
                // Posisikan dan ukur kelinci persis mengikuti dimensi cell yang ditempati
                // Ini mencegah objek bocor keluar arena
                bunnyDOM.style.width = targetCell.offsetWidth + 'px';
                bunnyDOM.style.height = targetCell.offsetHeight + 'px';
                bunnyDOM.style.left = targetCell.offsetLeft + 'px';
                bunnyDOM.style.top = targetCell.offsetTop + 'px';
            }
        }

        // Listener agar kelinci menyesuaikan letaknya saat ukuran layar/HP berubah
        window.addEventListener('resize', () => {
            if (bunnyDOM && document.getElementById('game-arena').style.display !== 'none') {
                updateBunnyPosition();
            }
        });

        // --- CODING CONTROLS ---
        function addBlock(dir) {
            if (isRunning) return;
            if (sequence.length >= 8) {
                alert("Kode terlalu panjang! Coba jalankan dulu.");
                return;
            }
            sequence.push(dir);
            renderSequence();
        }

        function removeBlock(index) {
            if (isRunning) return;
            sequence.splice(index, 1);
            renderSequence();
        }

        function clearSequence() {
            if (isRunning) return;
            sequence = [];
            renderSequence();
        }

        function renderSequence() {
            const box = document.getElementById('sequence-box');
            box.innerHTML = '';
            
            sequence.forEach((dir, index) => {
                const block = document.createElement('div');
                block.className = `block-item cb-${dir}`;
                block.innerHTML = SVG_ARROWS[dir];
                block.onclick = () => removeBlock(index);
                box.appendChild(block);
            });
            // Auto scroll to right
            box.scrollLeft = box.scrollWidth;
        }

        function enableControls(state) {
            isRunning = !state;
            document.getElementById('btn-play').style.opacity = state ? '1' : '0.5';
            document.getElementById('btn-play').innerText = state ? '▶ JALAN' : '⏳...';
        }

        // --- EXECUTION (Gerakan Psikomotor / Logika) ---
        async function runCode() {
            if (isRunning || sequence.length === 0) return;
            enableControls(false);

            // Reset posisi ke start awal level sebelum jalan
            const level = LEVELS[currentLevel];
            bunnyPos = { ...level.start };
            updateBunnyPosition();
            
            // Beri jeda sebentar sebelum mulai gerak
            await sleep(500);

            let crashed = false;

            for (let i = 0; i < sequence.length; i++) {
                const dir = sequence[i];
                let nextX = bunnyPos.x;
                let nextY = bunnyPos.y;

                if (dir === 'up') nextY--;
                if (dir === 'down') nextY++;
                if (dir === 'left') nextX--;
                if (dir === 'right') nextX++;

                // Cek Nabrak Tembok (Luar Grid)
                if (nextX < 0 || nextX > 3 || nextY < 0 || nextY > 3) {
                    crashAnim();
                    crashed = true;
                    break;
                }

                // Cek Nabrak Batu
                const targetCell = document.getElementById(`cell-${nextX}-${nextY}`);
                if (targetCell && targetCell.dataset.rock === "true") {
                    crashAnim();
                    crashed = true;
                    break;
                }

                // Jika aman, pindah
                bunnyPos.x = nextX;
                bunnyPos.y = nextY;
                
                // Tambahkan class hopping untuk animasi melompat (stimulus motorik)
                bunnyDOM.classList.add('hopping');
                updateBunnyPosition();
                
                playHopSound(); // Mainkan kesan bunyi melompat

                // Suara/Feedback imajiner: Minta anak loncat (via instruksi awal)
                await sleep(600); // Waktu animasi lompat
                bunnyDOM.classList.remove('hopping');
                await sleep(200); // Jeda sebelum lompat berikutnya
            }

            // Cek Menang (jika tidak crash)
            if (!crashed) {
                if (bunnyPos.x === level.goal.x && bunnyPos.y === level.goal.y) {
                    playWinSound(); // Mainkan kesan bunyi kejayaan
                    setTimeout(() => {
                        document.getElementById('win-screen').style.display = 'flex';
                    }, 500);
                } else {
                    // Kurang tepat, reset
                    setTimeout(() => {
                        bunnyDOM.classList.add('shake');
                        setTimeout(() => {
                            bunnyDOM.classList.remove('shake');
                            loadLevel(currentLevel); // Reset
                        }, 500);
                    }, 500);
                }
            } else {
                // Kalau nabrak, reset level
                setTimeout(() => loadLevel(currentLevel), 1000);
            }
        }

        function crashAnim() {
            playCrashSound(); // Mainkan kesan bunyi ralat
            bunnyDOM.classList.add('shake');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

    </script>
